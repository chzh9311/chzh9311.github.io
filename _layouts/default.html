<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    {% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% seo %}
</head>
<body>

  {% unless page.hide_nav %}
  <!-- ── Navigation (non-home pages) ── -->
  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <ul class="nav-links">
        {% for item in site.nav_pages %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}class="active"{% endif %}>
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </nav>
  {% endunless %}

  <!-- ── Page Content ── -->
  <main role="main">
    {{ content }}
  </main>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <div class="footer-inner">
      &copy; {{ site.author.name }}, last updated
      <time>{{ site.time | date: "%m/%Y" }}</time>
    </div>
  </footer>

</body>
</html>
